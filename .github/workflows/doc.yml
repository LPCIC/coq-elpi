# This is a basic workflow to help you get started with Actions

name: DOC

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build doc
    runs-on: ubuntu-latest
    steps:

    - name: workaround bug
      run: sudo apt-get update

    - name: checkout
      uses: actions/checkout@v3

    - name: setup ocaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: 4.14.2

    - name: install deps
      run: |
        export OPAMYES=true
        opam repo add coq https://coq.inria.fr/opam/released
        opam repo add coq-dev https://coq.inria.fr/opam/core-dev
        opam repo add extra-dev https://coq.inria.fr/opam/extra-dev
        opam update
        opam install rocq-core.9.2.0 vsrocq-language-server coq-core rocq-stdlib.9.2.0 coq-stdlib
        opam install ./rocq-elpi.opam
        sudo apt-get update
        sudo apt-get install python3-pip -y
        sudo pip3 install Sphinx sphinx-rtd-theme

    - name: build alectryon tutorials
      run: opam exec -- make doc

    - name: build sphinx reference manual
      run: opam exec -- make refman-build

    # Combined GH Pages layout: the older Alectryon-rendered tutorials keep
    # their existing root-level paths
    # (https://lpcic.github.io/coq-elpi/tutorial_*.html -- already linked
    # from both README.md and the new manual's own tutorial pages, via
    # ".. seealso::" notes), and the new Sphinx reference manual (the one
    # linked as "the reference manual" from README.md) is added alongside
    # under refman/.
    - name: combine docs for deployment
      run: |
        mkdir -p site
        cp -r doc/. site/
        mkdir -p site/refman
        cp -r docs/build/. site/refman/

    - name: Save artifact
      uses: actions/upload-artifact@v4
      with:
        path: site

    - name: deploy
      uses: JamesIves/github-pages-deploy-action@4.1.4
      if: ${{ github.ref == 'refs/heads/master' }}
      with:
        branch: gh-pages
        folder: site
